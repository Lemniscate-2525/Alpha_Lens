services:
  # AlphaLens FastAPI Backend Service
  - type: web
    name: alpha-lens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: alpha-lens-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: HF_HUB_OFFLINE
        value: "0"

  # AlphaLens Background Ingestion Worker
  - type: worker
    name: alpha-lens-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.workers.ingestion_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: alpha-lens-redis
          property: connectionString
      - key: HF_HUB_OFFLINE
        value: "0"

  # Redis Cache & Queue
  - type: redis
    name: alpha-lens-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru
